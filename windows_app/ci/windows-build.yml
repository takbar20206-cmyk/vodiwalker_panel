# ============================================================
# ساخت نسخه ویندوز VodiWalker Toolkit (exe + نصب‌کننده)
# روی هر push از این شاخه که windows_app/ را تغییر دهد اجرا می‌شود.
# ============================================================

name: windows-build

on:
  push:
    branches: [arena/d4e542fe-vodiwalker-panel]
    paths:
      - "windows_app/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows_app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows_app/requirements.txt

      - name: Smoke test (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python windows_app/smoke_test.py

      - name: Build executable (PyInstaller)
        run: pyinstaller --noconfirm --distpath dist --workpath build windows_app/VodiWalkerToolkit.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_app\installer.iss'

      - name: Package portable zip
        run: Compress-Archive -Force -Path dist\VodiWalkerToolkit\* -DestinationPath VodiWalker-Toolkit-win64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VodiWalker-Toolkit-Windows-v1.0.0
          if-no-files-found: error
          path: |
            VodiWalker-Toolkit-win64.zip
            dist/VodiWalker-Toolkit-Setup-*.exe

name: iranweather
description: "آیرانا Airana — اپلیکیشن هواشناسی کامل ایران: هوا، زلزله، رعدوبرق، کیفیت هوا و تمامی شهرهای ایران."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.2
  geolocator: ^12.0.0
  animations: ^2.0.11
  flutter_spinkit: ^5.2.1
  shimmer: ^3.0.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.2
  flutter_native_splash: ^2.3.10
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/maps/
    - assets/fonts/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  adaptive_icon:
    background_color: "#0B1836"
    foreground_image_path: "assets/icon/icon.png"

flutter_native_splash:
  background_color: "#0B1836"
  image: "assets/icon/icon.png"
  image_width: 200
  fullscreen: true
